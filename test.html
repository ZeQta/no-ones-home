<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fears to Fiction - Test Build</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Arial', sans-serif;
            background-color: #0a0a0a;
            color: #e0e0e0;
            overflow: hidden;
        }
        #menu { 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #0a0a0a 100%);
            z-index: 1000;
        }
        h1 { 
            font-size: 48px; 
            color: #ff4444;
            text-shadow: 0 0 20px #ff4444;
            margin-bottom: 20px;
        }
        button {
            width: 250px;
            height: 50px;
            margin: 10px;
            background: #1a1a1a;
            border: 2px solid #ff4444;
            color: #e0e0e0;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
        }
        button:hover {
            background: #ff4444;
            color: white;
            transform: scale(1.05);
        }
        #game-container { 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
        }
        #hud {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="menu">
        <h1>FEARS TO FICTION</h1>
        <h2 style="color: #a0a0a0; margin-bottom: 40px;">Episode 1: No One's Home</h2>
        <button onclick="startGame()">START EPISODE</button>
        <button onclick="alert('Settings coming soon')">SETTINGS</button>
        <p style="margin-top: 30px; color: #ff8c42;">⚠️ Headphones recommended</p>
    </div>
    
    <div id="game-container"></div>
    <div id="hud">Use WASD to move, Mouse to look, E to interact, ESC to pause</div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        let scene, camera, renderer, controls;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let velocity = new THREE.Vector3();
        let direction = new THREE.Vector3();

        window.startGame = async function() {
            document.getElementById('menu').classList.add('hidden');
            document.getElementById('hud').style.display = 'block';
            
            await initGame();
            animate();
        }

        async function initGame() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x2b3a67);
            scene.fog = new THREE.Fog(0x1a1f3a, 10, 50);

            // Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 5);

            // Renderer
            const container = document.getElementById('game-container');
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // Controls
            controls = new PointerLockControls(camera, renderer.domElement);
            scene.add(controls.getObject());

            renderer.domElement.addEventListener('click', () => {
                controls.lock();
            });

            controls.addEventListener('lock', () => {
                console.log('Pointer locked');
            });

            // Lighting
            const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(5, 10, 5);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // Floor
            const floorGeometry = new THREE.PlaneGeometry(50, 50);
            const floorMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x8b6f47, 
                roughness: 0.8 
            });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Simple room
            createRoom();

            // Input
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            console.log('Game initialized!');
        }

        function createRoom() {
            const wallMaterial = new THREE.MeshStandardMaterial({ 
                color: 0xf5f5dc, 
                roughness: 0.9 
            });

            // Walls
            const wallGeometry = new THREE.BoxGeometry(20, 3, 0.3);
            
            // North wall
            const northWall = new THREE.Mesh(wallGeometry, wallMaterial);
            northWall.position.set(0, 1.5, -10);
            northWall.castShadow = true;
            northWall.receiveShadow = true;
            scene.add(northWall);

            // South wall
            const southWall = new THREE.Mesh(wallGeometry, wallMaterial);
            southWall.position.set(0, 1.5, 10);
            southWall.castShadow = true;
            southWall.receiveShadow = true;
            scene.add(southWall);

            // East/West walls
            const sideWallGeometry = new THREE.BoxGeometry(0.3, 3, 20);
            
            const eastWall = new THREE.Mesh(sideWallGeometry, wallMaterial);
            eastWall.position.set(10, 1.5, 0);
            eastWall.castShadow = true;
            scene.add(eastWall);

            const westWall = new THREE.Mesh(sideWallGeometry, wallMaterial);
            westWall.position.set(-10, 1.5, 0);
            westWall.castShadow = true;
            scene.add(westWall);

            // Simple furniture
            const boxGeometry = new THREE.BoxGeometry(2, 0.5, 1.5);
            const boxMaterial = new THREE.MeshStandardMaterial({ color: 0x3366cc });
            const box = new THREE.Mesh(boxGeometry, boxMaterial);
            box.position.set(-5, 0.25, -5);
            box.castShadow = true;
            scene.add(box);

            // Table
            const tableGeometry = new THREE.BoxGeometry(1.5, 0.7, 1);
            const tableMaterial = new THREE.MeshStandardMaterial({ color: 0xdaa520 });
            const table = new THREE.Mesh(tableGeometry, tableMaterial);
            table.position.set(3, 0.35, 3);
            table.castShadow = true;
            scene.add(table);
        }

        function onKeyDown(event) {
            switch (event.code) {
                case 'KeyW': moveForward = true; break;
                case 'KeyA': moveLeft = true; break;
                case 'KeyS': moveBackward = true; break;
                case 'KeyD': moveRight = true; break;
                case 'Escape':
                    if (controls.isLocked) {
                        controls.unlock();
                    }
                    break;
            }
        }

        function onKeyUp(event) {
            switch (event.code) {
                case 'KeyW': moveForward = false; break;
                case 'KeyA': moveLeft = false; break;
                case 'KeyS': moveBackward = false; break;
                case 'KeyD': moveRight = false; break;
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            if (controls.isLocked) {
                // Movement
                const delta = 0.016; // ~60fps
                const speed = 3.5;

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                if (moveForward || moveBackward) velocity.z = direction.z * speed * delta;
                else velocity.z = 0;

                if (moveLeft || moveRight) velocity.x = direction.x * speed * delta;
                else velocity.x = 0;

                controls.moveRight(velocity.x);
                controls.moveForward(-velocity.z);
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
